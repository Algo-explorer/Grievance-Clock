services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.local
    environment:
      DATA_DIR: /data
    volumes:
      - cases:/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  cases:
